<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kirana partner portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><span class="wordmark">valmo</span><span class="brand-label">Kirana partner</span></div>
      <span class="prototype-label">DICE 3.0 prototype</span>
    </div>
  </header>
  <main><div class="app"><aside class="side" id="side" aria-label="Store navigation"></aside><section id="v" aria-label="Partner workspace"></section></div></main>
  <footer class="site-footer"><span>Meesho Nearby · Kirana partner portal</span><span>DICE 3.0 prototype</span></footer>
<script>
const O=[['MS892341','Priya Mehta',"Women's Kurti, size M",299,1,'incoming',0],['MS892342','Aman Verma',"Men's T-shirt, size L",499,0,'incoming',0],['MS892343','Neha Singh','Handbag',799,1,'incoming',0],['MS892344','Rohit Kumar','Shoes, size 8',1299,0,'incoming',0],
['MS892331','Kavya Rao','Cotton kurti set',349,1,'stored',2],['MS892332','Dev Malhotra','Backpack',0,0,'stored',4],['MS892333','Isha Gupta','Cushion covers',420,0,'stored',1],['MS892321','Rohan Das','Analog watch',899,1,'picked',0],['MS892311','Meera Joshi','Bedsheet',650,0,'returned',0]]
.map(a=>({id:a[0],name:a[1],item:a[2],cod:a[3],tok:a[4],st:a[5],left:a[6]}));
const T={dash:'Dashboard',recv:'Receive from delivery',pick:'Customer pickup',ord:'Orders tracker',earn:'Earnings'};
const ST={incoming:['Arriving','#3B7DDD'],stored:['Awaiting pickup','#D98A00'],picked:['Picked up','#1E8E5A'],returned:['Returned','#C73A3A']};
const s={tab:'dash',cur:'',scan2:'',pay:'UPI',code:'',err:'',msg:'',done:null,f:'all'};
const m=n=>'₹'+n.toLocaleString('en-IN'),$=i=>document.getElementById(i);
const due=o=>o.cod?o.cod-(o.tok?20:0):0,by=k=>O.filter(o=>o.st==k),get=id=>O.find(o=>o.id==id);
const go=t=>{s.tab=t;s.err=s.msg='';s.code='';s.scan2='';s.done=null;draw()};
function recv(id){const o=id?get(id):by('incoming')[0];if(!o||o.st!='incoming')return;o.st='stored';o.left=5;s.msg=o.id+' scanned as received from delivery. Added to inventory, customer notified, ready for pickup.';draw()}
function sc2(){s.scan2=s.cur;s.err='';draw()}
function hand(){const o=get(s.cur);if(s.scan2!=o.id){s.err='Scan the parcel as picked up by the customer first.';return draw()}if(s.code!=='4821'){s.err='Code does not match. Do not hand over the parcel.';return draw()}o.st='picked';s.done=o;s.err='';draw()}
function back(id){get(id).st='returned';draw()}
const V={
dash:()=>`<div class="page-heading"><p class="eyebrow">Store overview</p><h1>Ramesh General Store</h1><p class="sub">Your parcels, pickups and collections in one place.</p></div>
<div class="stats">${['incoming','stored','picked','returned'].map(k=>`<div class="stat"><span>${ST[k][0]}</span><b>${by(k).length}</b></div>`).join('')}<div class="stat stat-cod"><span>COD to collect</span><b>${m(by('stored').reduce((a,o)=>a+due(o),0))}</b></div></div>
<div class="card batch-card"><div class="panel-heading"><div><p class="eyebrow">Tuesday delivery</p><h2>Today's batch</h2></div><span class="batch-id">VAL-28194</span></div><p class="batch-count"><strong>${by('incoming').length}</strong> parcels left to receive</p><p class="muted">Scan each parcel at the store before it is ready for customer pickup.</p><div class="row"><button class="solid" onclick="go('recv')">Receive from delivery</button><button onclick="go('pick')">Customer pickup</button><button class="quiet" onclick="go('ord')">See all orders</button></div></div>
<div class="card"><h2>Every parcel is scanned twice</h2><div class="scan-process"><div class="process-step"><span class="step-number">1</span><div><h3>Received scan</h3><p>Scan when the delivery partner drops the parcel at your store.</p></div></div><div class="process-step"><span class="step-number">2</span><div><h3>Pickup scan</h3><p>Scan when the customer collects it, then verify their pickup code.</p></div></div></div><div class="store-note"><p><b>Cash handling</b> · Cash in hand is capped at ₹3,000 and swept to UPI within 24 hours.</p><p><b>Deposit held</b> · ₹10,000</p></div></div>`,
recv:()=>`<div class="page-heading"><p class="eyebrow">Parcel receipt</p><h1>Receive from delivery</h1><p class="sub">Scan each parcel when it arrives from the delivery partner. ${by('incoming').length} left.</p></div>${s.msg?`<div class="okbox" role="status" aria-live="polite">${s.msg}</div>`:''}
<div class="card"><div class="panel-heading"><div><h2>Tuesday batch</h2><p class="muted">VAL-28194</p></div><span class="batch-id">${by('incoming').length} to receive</span></div><div class="table-scroll" tabindex="0" role="region" aria-label="Parcels to receive"><table class="receive-table"><caption class="sr-only">Incoming parcels in batch VAL-28194</caption><thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Item</th><th scope="col" class="r">COD</th><th scope="col" class="r">Action</th></tr></thead><tbody>${by('incoming').map(o=>`<tr><td class="order-id">${o.id}</td><td>${o.name}</td><td>${o.item}</td><td class="r amount">${o.cod?m(o.cod):'Prepaid'}</td><td class="r"><button onclick="recv('${o.id}')">Scan received</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">All parcels in this batch are scanned in.</td></tr>'}</tbody></table></div><div class="table-actions"><button class="solid" ${by('incoming').length?'':'disabled'} onclick="recv()">Scan next received parcel</button><p class="muted">A received scan adds the parcel to your store inventory.</p></div></div>`,
pick:()=>{if(s.done){const o=s.done;return `<div class="page-heading"><p class="eyebrow">Customer pickup</p><h1>Pickup completed</h1><p class="sub">The parcel is ready to leave your store.</p></div><div class="okbox" role="status" aria-live="polite"><b>${o.id} handed over to ${o.name}.</b> Parcel scanned as picked up.</div><div class="card completion-card"><h2>Pickup receipt</h2><table class="summary-table"><caption class="sr-only">Payment collected for ${o.id}</caption><tbody><tr class="total-row"><th scope="row">Payment collected (${s.pay})</th><td class="r"><b>${m(due(o))}</b></td></tr>${o.cod?`<tr><th scope="row">Original order value</th><td class="r">${m(o.cod)}</td></tr>${o.tok?'<tr><th scope="row">Token already paid</th><td class="r">− ₹20</td></tr>':''}`:''}</tbody></table><div class="table-actions"><button class="solid" onclick="go('pick')">Next pickup</button></div></div>`}
const h=by('stored');if(!h.length)return `<div class="page-heading"><p class="eyebrow">Parcel handover</p><h1>Customer pickup</h1></div><div class="card empty-state"><h2>No parcels waiting for pickup</h2><p>Scan a batch in first.</p><button class="solid" onclick="go('recv')">Receive from delivery</button></div>`;
if(!h.find(o=>o.id==s.cur))s.cur=h[0].id;const o=get(s.cur),ok=s.scan2==o.id;
return `<div class="page-heading"><p class="eyebrow">Parcel handover</p><h1>Customer pickup</h1><p class="sub">Scan the parcel when the customer picks it up, then verify their code.</p></div>${s.err?`<div class="errbox" id="pickup-error" role="alert">${s.err}</div>`:''}
<div class="two pickup-layout"><div class="card pickup-form"><h2>Verify this pickup</h2><label for="pickup-parcel">Parcel</label><select id="pickup-parcel" onchange="s.cur=this.value;s.scan2='';draw()">${h.map(x=>`<option value="${x.id}" ${x.id==s.cur?'selected':''}>${x.id} · ${x.name}</option>`).join('')}</select>
<div class="pickup-step"><div class="step-heading"><span class="step-number">1</span><h3>Scan the pickup parcel</h3></div><p class="muted">Scan the parcel the customer is collecting.</p>${ok?'<div class="okbox scan-status" role="status" aria-live="polite">Parcel scanned as picked up</div>':'<button class="solid" onclick="sc2()">Scan picked-up parcel</button>'}</div>
<div class="pickup-step"><div class="step-heading"><span class="step-number">2</span><h3>Verify the pickup code</h3></div><label for="pickup-code">Customer pickup code</label><input id="pickup-code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" value="${s.code}" aria-describedby="code-help${s.err?' pickup-error':''}" ${s.err&&s.err.startsWith('Code')?'aria-invalid="true"':''} oninput="s.code=this.value"><p class="field-help" id="code-help">Demo code: 4821</p></div>
<fieldset class="payment-field"><legend>Payment</legend><div class="seg">${['UPI','Cash'].map(x=>`<button type="button" aria-pressed="${s.pay==x}" class="${s.pay==x?'solid':''}" onclick="s.pay='${x}';draw()">${x}</button>`).join('')}</div></fieldset><button class="solid handover-button" onclick="hand()">Confirm and hand over</button></div>
<div class="card pickup-summary"><p class="eyebrow">Selected parcel</p><h2>${o.name}</h2><p class="parcel-item">${o.item}</p><p class="order-id muted">${o.id}</p><table class="summary-table"><caption class="sr-only">Collection amount for ${o.id}</caption><tbody>${o.cod?`<tr><th scope="row">Original COD</th><td class="r">${m(o.cod)}</td></tr>${o.tok?'<tr><th scope="row">₹20 token already paid</th><td class="r">− ₹20</td></tr>':''}<tr class="total-row"><th scope="row"><b>Collect at store</b></th><td class="r"><b>${m(due(o))}</b></td></tr>`:'<tr class="total-row"><th scope="row"><b>Prepaid</b></th><td class="r">Nothing to collect</td></tr>'}<tr><th scope="row">Days left to collect</th><td class="r">${o.left}</td></tr></tbody></table></div></div>`},
ord:()=>{const F=[['all','All']].concat(Object.keys(ST).map(k=>[k,ST[k][0]])),L=O.filter(o=>s.f=='all'||o.st==s.f);
return `<div class="page-heading"><p class="eyebrow">Store inventory</p><h1>Orders tracker</h1><p class="sub">Every parcel at your store and where it stands.</p></div><div class="steps" role="group" aria-label="Filter orders by status">${F.map(f=>`<button aria-pressed="${s.f==f[0]}" class="${s.f==f[0]?'on':''}" onclick="s.f='${f[0]}';draw()">${f[1]} (${f[0]=='all'?O.length:by(f[0]).length})</button>`).join('')}</div>
<div class="card orders-card"><div class="panel-heading"><h2>Parcel inventory</h2><span class="muted">${L.length} orders</span></div><div class="table-scroll" tabindex="0" role="region" aria-label="Parcel inventory"><table class="orders-table"><caption class="sr-only">Order status and parcel scans</caption><thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Item</th><th scope="col" class="r">To collect</th><th scope="col">Status</th><th scope="col">Received from delivery</th><th scope="col">Picked up by customer</th><th scope="col" class="r">Action</th></tr></thead><tbody>${L.map(o=>`<tr><td class="order-id">${o.id}</td><td>${o.name}</td><td>${o.item}</td><td class="r amount">${due(o)?m(due(o)):'-'}</td><td><span class="status status-${o.st}">${ST[o.st][0]}</span>${o.st=='stored'?`<small class="days-left">${o.left} days left</small>`:''}</td><td>${o.st!='incoming'?'Yes':'-'}</td><td>${o.st=='picked'?'Yes':'-'}</td><td class="r">${o.st=='stored'?`<button class="return-button" onclick="back('${o.id}')">Return to hub</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`},
earn:()=>`<div class="page-heading"><p class="eyebrow">Partner payments</p><h1>Earnings this month</h1><p class="sub">Your handling, COD custody and pickup earnings.</p></div><div class="stats earnings-stats"><div class="stat"><span>Total earnings</span><b>₹1,780</b></div><div class="stat"><span>Next payout</span><b>Friday</b></div></div>
<div class="card earnings-card"><h2>Breakdown</h2>${[['Base handling',1280],['COD custody',320],['Pickup bonus',180]].map(x=>`<div class="earnings-line"><b>${x[0]}</b><span>${m(x[1])}</span></div><div class="bar" aria-hidden="true"><i style="width:${x[1]/1780*100}%;background:var(--acc)"></i></div>`).join('')}</div>`};
function draw(){document.title=T[s.tab]+' · Valmo';$('side').innerHTML=`<div class="store-identity"><b>Ramesh General Store</b><small>Valmo Kirana partner</small></div><nav aria-label="Kirana partner">`+Object.keys(T).map(k=>`<button class="${s.tab==k?'on':''}" ${s.tab==k?'aria-current="page"':''} onclick="go('${k}')">${T[k]}</button>`).join('')+`</nav><p class="side-note">Receive at the store.<br>Hand over with a verified code.</p>`;$('v').innerHTML=V[s.tab]()}
draw();
</script>
</body>
</html>
